<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 112" width="1280" height="448" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <title>Secuencia BOOT + RESET para el modo de recuperación</title>
  <text x="6" y="10" font-size="4.6" font-weight="bold" fill="#1d2733">Modo de recuperación (descarga) del ESP32-S3</text>

  <!-- ejes -->
  <text x="6" y="34" font-size="3.8" font-weight="bold" fill="#e08a00">BOOT (SW16)</text>
  <text x="6" y="64" font-size="3.8" font-weight="bold" fill="#c0392b">RESET (SW14)</text>
  <text x="44" y="27" font-size="2.8" fill="#4a5560">suelto</text>
  <text x="44" y="39" font-size="2.8" fill="#4a5560">pulsado</text>
  <text x="44" y="57" font-size="2.8" fill="#4a5560">suelto</text>
  <text x="44" y="69" font-size="2.8" fill="#4a5560">pulsado</text>

  <!-- BOOT: arriba = suelto, abajo = pulsado -->
  <polyline points="62,26 90,26 90,38 250,38 250,26 300,26" fill="none" stroke="#e08a00" stroke-width="1.6"/>
  <!-- RESET -->
  <polyline points="62,56 130,56 130,68 180,68 180,56 300,56" fill="none" stroke="#c0392b" stroke-width="1.6"/>

  <!-- marcas de pasos -->
  <g font-size="3.6" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="90" cy="84" r="4" fill="#0b7d8c"/><text x="90" y="85.4">1</text>
    <circle cx="130" cy="84" r="4" fill="#0b7d8c"/><text x="130" y="85.4">2</text>
    <circle cx="180" cy="84" r="4" fill="#0b7d8c"/><text x="180" y="85.4">3</text>
    <circle cx="250" cy="84" r="4" fill="#0b7d8c"/><text x="250" y="85.4">4</text>
  </g>
  <g stroke="#0b7d8c" stroke-width="0.4" stroke-dasharray="1.5 1.2">
    <line x1="90" y1="20" x2="90" y2="80"/><line x1="130" y1="20" x2="130" y2="80"/>
    <line x1="180" y1="20" x2="180" y2="80"/><line x1="250" y1="20" x2="250" y2="80"/>
  </g>
  <g font-size="3" fill="#1d2733" text-anchor="middle">
    <text x="90" y="95">mantén BOOT</text>
    <text x="130" y="95">pulsa RESET</text>
    <text x="180" y="95">suelta RESET</text>
    <text x="250" y="95">suelta BOOT</text>
  </g>
  <text x="160" y="106" font-size="3" fill="#4a5560" text-anchor="middle" font-style="italic">El chip arranca en modo descarga: la pantalla no muestra imagen y el PC ve un puerto «USB JTAG/serial debug unit».</text>
</svg>
