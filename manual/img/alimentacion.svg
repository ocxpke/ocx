<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 116" width="1280" height="464" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <title>Cómo alimentar la consola OCX</title>

  <!-- cargador -->
  <g transform="translate(8,22)">
    <rect x="0" y="0" width="40" height="44" rx="5" fill="#eef1f4" stroke="#44505c" stroke-width="0.8"/>
    <rect x="15" y="44" width="10" height="4" fill="#9aa3ad"/>
    <text x="20" y="18" font-size="4.2" text-anchor="middle" fill="#1d2733" font-weight="bold">5 V</text>
    <text x="20" y="25" font-size="3.6" text-anchor="middle" fill="#1d2733">≥ 1,5 A</text>
    <text x="20" y="-9" font-size="3.2" text-anchor="middle" fill="#4a5560">cargador USB-C</text>
    <text x="20" y="-4.5" font-size="3.2" text-anchor="middle" fill="#4a5560">o puerto USB-C del PC</text>
  </g>
  <!-- cable -->
  <path d="M 28 70 C 28 102, 222 102, 226 75" fill="none" stroke="#2b2b2b" stroke-width="2.2"/>
  <text x="127" y="108" font-size="3.4" text-anchor="middle" fill="#1d2733" font-weight="bold">cable USB-C ↔ USB-C (recomendado)</text>

  <!-- placa -->
  <g transform="translate(100,14)">
    <rect x="0" y="0" width="150" height="60" rx="3" fill="#1f5f3a"/>
    <path d="M 55 0 L 55 3.5 L 85 3.5 L 85 0" fill="#ffffff"/>
    <!-- devkit -->
    <rect x="60" y="2" width="20" height="40" rx="1" fill="#14202e"/>
    <rect x="63" y="0.5" width="14" height="5" fill="#f0ead6"/>
    <rect x="62" y="38" width="6" height="4" rx="0.8" fill="#9aa3ad"/>
    <rect x="72" y="38" width="6" height="4" rx="0.8" fill="#9aa3ad"/>
    <text x="70" y="24" font-size="3" fill="#ffffff" text-anchor="middle" transform="rotate(-90 70 24)">DevKit</text>
    <!-- J10 -->
    <rect x="2" y="56" width="10" height="5" rx="1.5" fill="#c9ced4" stroke="#555" stroke-width="0.4" transform="translate(119,-1)"/>
    <text x="126" y="51" font-size="3.4" fill="#f4f4f0" text-anchor="middle" font-weight="bold">J10</text>
    <circle cx="142" cy="53" r="1.6" fill="#59e36b"/>
    <text x="142" y="48" font-size="2.8" fill="#f4f4f0" text-anchor="middle">D2</text>
  </g>
    <text x="240" y="88" font-size="3.6" fill="#1b7a3a" font-weight="bold">✓ Solo por J10</text>

  <!-- prohibido: USB de la DevKit -->
  <g transform="translate(256,14)">
    <circle cx="28" cy="22" r="18" fill="none" stroke="#c0392b" stroke-width="2.4"/>
    <line x1="15.3" y1="9.3" x2="40.7" y2="34.7" stroke="#c0392b" stroke-width="2.4"/>
    <rect x="21" y="16" width="14" height="10" rx="2" fill="#9aa3ad"/>
    <text x="28" y="50" font-size="3.4" text-anchor="middle" fill="#c0392b" font-weight="bold">USB de la DevKit</text>
    <text x="28" y="55" font-size="3.2" text-anchor="middle" fill="#c0392b">nunca a la vez que J10</text>
  </g>
  <line x1="182" y1="56" x2="266" y2="38" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="2 1.5"/>
</svg>
